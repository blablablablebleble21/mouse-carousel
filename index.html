<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actions Ring</title>
    <link rel="stylesheet" href="carousel.css">
</head>
<body>
    <div class="ring-wrapper">
        <button class="center-dot" aria-label="Close actions ring"></button>
        
        <button class="ring-sector" style="--i:0;" data-action="spotify" aria-label="Open Spotify"><span class="icon">♪</span></button>
        <button class="ring-sector" style="--i:2;" data-action="copy" aria-label="Copy selection"><span class="icon">⧉</span></button>
        <button class="ring-sector" style="--i:1;" data-action="paste" aria-label="Paste"><span class="icon">▣</span></button>
        <button class="ring-sector" style="--i:3;" data-action="last-window" aria-label="Switch to previous window"><span class="icon">↹</span></button>
        <button class="ring-sector" style="--i:4;" data-action="screenshot" aria-label="Take screen clipping"><span class="icon">⌗</span></button>
        <button class="ring-sector" style="--i:5;" data-action="gear" aria-label="Open Windows settings"><span class="icon">⚙</span></button>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
